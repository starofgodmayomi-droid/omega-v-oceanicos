services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      NODE_ENV: production
      API_PORT: 3000
      OMEGA_RUNTIME_STORE_PATH: /var/lib/omega/runtime.json
      OMEGA_SIGNING_KEY: ${OMEGA_SIGNING_KEY:-key-2026-08-container-dev}
    volumes:
      - omega-runtime:/var/lib/omega
    ports:
      - '3000:3000'

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3001:3001'

volumes:
  omega-runtime:
