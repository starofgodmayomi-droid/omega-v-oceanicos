<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Omega infinity v">
  <title>Ω∞v — one root, one current, infinite forms</title>
  <defs>
    <linearGradient id="current" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ce8c8" />
      <stop offset="1" stop-color="#1b3b35" />
    </linearGradient>
  </defs>

  <!-- The drop: one root. Everything else is a form it takes. -->
  <path
    d="M64 10 C64 10 26 56 26 80 a38 38 0 0 0 76 0 C102 56 64 10 64 10 Z"
    fill="url(#current)"
  />

  <!-- The current: a single unbroken line, because the loop never terminates. -->
  <path
    d="M38 84 c9 -14 18 -14 26 0 c8 14 17 14 26 0"
    fill="none"
    stroke="#071312"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- The verification mark, carried inside the drop rather than beside it. -->
  <path
    d="M50 60 l10 11 l19 -23"
    fill="none"
    stroke="#071312"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
