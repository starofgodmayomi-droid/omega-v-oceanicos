global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'omega-v-oceanicos'

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'rules.yml'
