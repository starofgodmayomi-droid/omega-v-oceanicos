version: '3.8'

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    volumes:
      - oceanicos-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v1/block/tip"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oceanicos-data:
