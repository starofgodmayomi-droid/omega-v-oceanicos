version: '3.8'

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      OMEGA_SIGNING_KEY: ${OMEGA_SIGNING_KEY:-ci-test-secret-key-at-least-16-chars-2026}
      OMEGA_LEDGER_PATH: /app/data/oceanicos.jsonl
    volumes:
      - ledger-storage:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/v1/omega/workers').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ledger-storage:
