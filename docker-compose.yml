version: '3.8'
services:
  api:
    build: .
    ports: ["5000:5000"]
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      OMEGA_SIGNING_KEY: ${OMEGA_SIGNING_KEY:?Set OMEGA_SIGNING_KEY inside .env}
      LEDGER_PATH: /app/data/oceanicos.jsonl
    volumes: ["ledger-storage:/app/data"]
  web:
    build: .
    ports: ["3000:3000"]
    command: pnpm --filter @oceanicos/web build && pnpm dlx serve apps/web/dist -l 3000
    depends_on: [api]
volumes:
  ledger-storage:
