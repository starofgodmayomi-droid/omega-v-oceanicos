version: '3.8'

# Ω∞v Oceanicos Singularity Orchestration Matrix
# Architecture: one API origin serves the Core Engine and built Web UI; optional local inference and vector memory.
# Hardware States:
#   MINI_OMAGE  : Strict hardware limits to secure the base architecture memory envelope
#   MAX_RUN_MOOD: Unified memory processing within the configured runtime limits

services:
  # ── 1. API: Core Engine, Cryptographic Ledger & Telemetry Matrix ───────────────
  api:
    build:
      context: .
      target: api
      args:
        VITE_API_URL: ""
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:?VITE_AUTH0_DOMAIN is required}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:?VITE_AUTH0_CLIENT_ID is required}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:?VITE_AUTH0_AUDIENCE is required}
    ports:
      - "3000:5000"
    environment:
      - NODE_ENV=production
      - API_PORT=5000
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - OMEGA_SIGNING_KEY=${OMEGA_SIGNING_KEY:?OMEGA_SIGNING_KEY is required}
      - OMEGA_AUTH_MODE=required
      - OMEGA_READ_TOKEN=${OMEGA_READ_TOKEN:?OMEGA_READ_TOKEN is required}
      - OMEGA_ADMIN_TOKEN=${OMEGA_ADMIN_TOKEN:?OMEGA_ADMIN_TOKEN is required}
      - OMEGA_OIDC_ISSUER=${OMEGA_OIDC_ISSUER:?OMEGA_OIDC_ISSUER is required}
      - OMEGA_OIDC_AUDIENCE=${OMEGA_OIDC_AUDIENCE:?OMEGA_OIDC_AUDIENCE is required}
      - OMEGA_OIDC_JWKS_URI=${OMEGA_OIDC_JWKS_URI:?OMEGA_OIDC_JWKS_URI is required}
      - OMEGA_CONNECTOR_APPROVER_SUBJECT=${OMEGA_CONNECTOR_APPROVER_SUBJECT:?OMEGA_CONNECTOR_APPROVER_SUBJECT is required}
      - OMEGA_MODE=${OMEGA_MODE:-MAX_FLUID}
      - OMEGA_DB_PATH=${OMEGA_DB_PATH:-/app/data/oceanicos.db}
      - PIDGIN_ENGINE=${PIDGIN_ENGINE:-ON}
    volumes:
      - oceanicos-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-2.0}'
          memory: '${MEM_LIMIT:-2G}'

  # ── 2. Qdrant: Dense Vector Memory Engine ──────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── 3. Ollama: Optional Local Model Inference Engine ───────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        limits:
          memory: '${OLLAMA_MEM_LIMIT:-8G}'

volumes:
  oceanicos-data:
  qdrant-data:
  ollama-models:
