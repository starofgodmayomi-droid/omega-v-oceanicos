# Base44 dev environment for Ω∞v Oceanicos
# Development-oriented: runs from bind-mounted source with live reload.
volumes:
  pnpm-store:

services:
  # One-shot: install deps + build the API's workspace dependency tree.
  setup:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      # Keep the content-addressable store outside the bind mount: the repo ships a
      # tracked .pnpm-store/, and installing into it rewrote tracked files on every
      # boot (dirty working tree). The volume persists between restarts.
      - pnpm-store:/pnpm-store
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile --store-dir=/pnpm-store && pnpm --filter api... run build"
    environment:
      - CI=true

  # API: Fastify server (CommonJS, tsc --watch + node --watch live reload).
  api:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    # Start node --watch only after tsc's initial pass finished: emitting ~9 files
    # into dist while node --watch is already running restarted the server nine
    # times in a row at boot, so the WORKERS panel's poll hit a closed port
    # (ECONNREFUSED through the Vite proxy). Later edits emit one file → one restart.
    command: sh -c "mkdir -p data && (npx tsc --watch -p apps/api > /tmp/tsc.log 2>&1 &) && until grep -q 'Watching for file changes' /tmp/tsc.log 2>/dev/null; do sleep 0.3; done && exec node --watch apps/api/dist/index.js"
    environment:
      - NODE_ENV=development
      - API_PORT=5000
      - PORT=5000
      - OMEGA_AUTH_MODE=local
      - OMEGA_DB_PATH=/app/data/oceanicos.db
      - OMEGA_ALLOW_UNSIGNED_CYCLE=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    ports:
      - "5000:5000"
    restart: on-failure
    labels:
      base44.project: api
      base44.kind: worker
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # Web: Vite + React dev server (live reload), public on port 3000.
  web:
    image: node:22
    working_dir: /app/apps/web
    volumes:
      - .:/app
    command: sh -c "mkdir -p ../data && npx vite --host 0.0.0.0 --port 3000"
    environment:
      - VITE_API_URL=https://5000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Browser-relative /api/* requests are proxied by the Vite dev server. Inside
      # this container the API is the `api` service, not localhost, so the proxy
      # target must be the service name. Without it every /api/* call fails with
      # ECONNREFUSED 127.0.0.1:5000 (the WORKERS panel observed that failure).
      - VITE_API_PROXY_TARGET=http://api:5000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    ports:
      - "3000:3000"
    restart: on-failure
    labels:
      base44.project: web
      base44.kind: web
      base44.port: "3000"
    depends_on:
      setup:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
