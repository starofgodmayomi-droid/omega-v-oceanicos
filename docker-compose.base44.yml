# Base44 dev environment for Ω∞v Oceanicos
# Development-oriented: runs from bind-mounted source with live reload.
volumes:
  pnpm-store:

services:
  # One-shot: install deps + build the API's workspace dependency tree.
  setup:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      # Keep the content-addressable store outside the bind mount: the repo ships a
      # tracked .pnpm-store/, and installing into it rewrote tracked files on every
      # boot (dirty working tree). The volume persists between restarts.
      - pnpm-store:/pnpm-store
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile --store-dir=/pnpm-store && pnpm --filter api... run build"
    environment:
      - CI=true

  # API: Fastify server (CommonJS, tsc --watch + node --watch live reload).
  api:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    # Live reload is debounced: tsc --watch emits one file at a time, and a plain
    # `node --watch` restart per emit took the port down for each file (7 restarts
    # in 7s at boot). A polling client such as the WORKERS panel then hit a closed
    # port through the Vite proxy (ECONNREFUSED). This supervisor waits for tsc's
    # initial pass, then restarts the server once per compile batch, so the server
    # is offline for a single short restart instead of a burst.
    command:
      - sh
      - -ec
      - |
        mkdir -p data
        npx tsc --watch -p apps/api > /tmp/tsc.log 2>&1 &
        tsc_pid=$$!
        compiles() { grep -c 'Watching for file changes' /tmp/tsc.log 2>/dev/null || true; }
        until [ "$$(compiles)" -ge 1 ]; do
          if ! kill -0 "$$tsc_pid" 2>/dev/null; then
            echo "tsc exited before the first compile" >&2
            tail -20 /tmp/tsc.log >&2
            exit 1
          fi
          sleep 0.3
        done
        start_api() { node apps/api/dist/index.js & api_pid=$$!; }
        seen=$$(compiles); seen=$${seen:-0}
        start_api
        while kill -0 "$$tsc_pid" 2>/dev/null; do
          sleep 0.4
          now=$$(compiles); now=$${now:-0}
          if [ "$$now" -gt "$$seen" ]; then
            sleep 1
            seen=$$(compiles); seen=$${seen:-0}
            kill "$$api_pid" 2>/dev/null || true
            wait "$$api_pid" 2>/dev/null || true
            sleep 0.2
            start_api
          elif ! kill -0 "$$api_pid" 2>/dev/null; then
            sleep 1
            start_api
          fi
        done
        kill "$$api_pid" 2>/dev/null || true
    environment:
      - NODE_ENV=development
      - API_PORT=5000
      - PORT=5000
      - OMEGA_AUTH_MODE=local
      - OMEGA_DB_PATH=/app/data/oceanicos.db
      - OMEGA_ALLOW_UNSIGNED_CYCLE=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    ports:
      - "5000:5000"
    restart: on-failure
    labels:
      base44.project: api
      base44.kind: worker
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # Web: Vite + React dev server (live reload), public on port 3000.
  web:
    image: node:22
    working_dir: /app/apps/web
    volumes:
      - .:/app
    command: sh -c "mkdir -p ../data && npx vite --host 0.0.0.0 --port 3000"
    environment:
      - VITE_API_URL=https://5000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Browser-relative /api/* requests are proxied by the Vite dev server. Inside
      # this container the API is the `api` service, not localhost, so the proxy
      # target must be the service name. Without it every /api/* call fails with
      # ECONNREFUSED 127.0.0.1:5000 (the WORKERS panel observed that failure).
      - VITE_API_PROXY_TARGET=http://api:5000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    ports:
      - "3000:3000"
    restart: on-failure
    labels:
      base44.project: web
      base44.kind: web
      base44.port: "3000"
    depends_on:
      setup:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
