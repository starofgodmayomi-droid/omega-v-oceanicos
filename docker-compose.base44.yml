# Base44 dev environment for Ω∞v Oceanicos
# Development-oriented: runs from bind-mounted source with live reload.
services:
  # One-shot: install deps + build the API's workspace dependency tree.
  setup:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm --filter api... run build"
    environment:
      - CI=true

  # API: Fastify server (CommonJS, tsc --watch + node --watch live reload).
  api:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "mkdir -p data && npx tsc --watch -p apps/api & node --watch apps/api/dist/index.js"
    environment:
      - NODE_ENV=development
      - API_PORT=5000
      - PORT=5000
      - OMEGA_AUTH_MODE=local
      - OMEGA_DB_PATH=/app/data/oceanicos.db
      - OMEGA_ALLOW_UNSIGNED_CYCLE=true
    env_file:
      - path: ./.env.base44-defaults
        required: true
      # Platform-managed secret delivery file. It lives outside the repo and is
      # written asynchronously by the platform, so it may not exist yet on the
      # very first start (e.g. right after a branch/secret change): a required
      # entry makes `docker compose up` exit 1 with "env file ... not found" and
      # the preview never starts. Still listed LAST so real values win over the
      # placeholders above whenever it is present.
      - path: /run/base44/app.env
        required: false
    ports:
      - "5000:5000"
    restart: on-failure
    labels:
      base44.project: api
      base44.kind: worker
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # Web: Vite + React dev server (live reload), public on port 3000.
  web:
    image: node:22
    working_dir: /app/apps/web
    volumes:
      - .:/app
    command: sh -c "mkdir -p ../data && npx vite --host 0.0.0.0 --port 3000"
    environment:
      - VITE_API_URL=https://5000-${BASE44_PUBLIC_HOST_SUFFIX}
      # Browser-relative /api/* requests are proxied by the Vite dev server. Inside
      # this container the API is the `api` service, not localhost, so the proxy
      # target must be the service name. Without it every /api/* call fails with
      # ECONNREFUSED 127.0.0.1:5000 (the WORKERS panel observed that failure).
      - VITE_API_PROXY_TARGET=http://api:5000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - path: ./.env.base44-defaults
        required: true
      # Platform-managed secret delivery file. It lives outside the repo and is
      # written asynchronously by the platform, so it may not exist yet on the
      # very first start (e.g. right after a branch/secret change): a required
      # entry makes `docker compose up` exit 1 with "env file ... not found" and
      # the preview never starts. Still listed LAST so real values win over the
      # placeholders above whenever it is present.
      - path: /run/base44/app.env
        required: false
    ports:
      - "3000:3000"
    restart: on-failure
    labels:
      base44.project: web
      base44.kind: web
      base44.port: "3000"
    depends_on:
      setup:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
