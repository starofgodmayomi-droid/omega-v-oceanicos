name: Pull Request Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Full test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full test coverage
        run: pnpm test:coverage --coverageReporters=text --coverageReporters=json-summary --coverageReporters=lcov

      - name: Add coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const total = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          const percent = (metric) => `${metric.pct}% (${metric.covered}/${metric.total})`;
          console.log('## Coverage summary');
          console.log('');
          console.log('| Metric | Result |');
          console.log('| --- | ---: |');
          console.log(`| Statements | ${percent(total.statements)} |`);
          console.log(`| Branches | ${percent(total.branches)} |`);
          console.log(`| Functions | ${percent(total.functions)} |`);
          console.log(`| Lines | ${percent(total.lines)} |`);
          NODE

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-coverage-${{ github.event.pull_request.number || github.run_id }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
