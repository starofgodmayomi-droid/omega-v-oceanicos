name: Bounded Full-Stack Worker

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Finite worker cycles (1-32)'
        required: true
        default: '1'
        type: string
      interval_ms:
        description: 'Delay between cycles in milliseconds (0-3600000)'
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: bounded-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    name: Worker verification (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMEGA_WORKER_CYCLES: ${{ inputs.cycles || '1' }}
      OMEGA_WORKER_INTERVAL_MS: ${{ inputs.interval_ms || '0' }}

    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run audit

      - name: Prepare worker evidence directory
        run: mkdir -p worker-evidence

      - name: Run bounded worker inspection
        shell: bash
        run: |
          set -o pipefail
          pnpm worker 2>&1 | tee worker-evidence/inspection.log

      - name: Run bounded worker verification
        shell: bash
        run: |
          set -o pipefail
          pnpm worker:verify 2>&1 | tee worker-evidence/verification.log

      - name: Upload bounded worker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bounded-worker-evidence-${{ github.sha }}
          path: worker-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Record worker evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### 💧 Ω∞v bounded worker evidence'
            echo ''
            echo "- Commit: \\`${GITHUB_SHA}\\`"
            echo '- Runtime: Node 22.x on ubuntu-latest'
            echo "- Cycles: \\`${OMEGA_WORKER_CYCLES}\\`"
            echo "- Interval: \\`${OMEGA_WORKER_INTERVAL_MS}ms\\`"
            echo '- External action: OFF'
            echo '- Git write: OFF'
            echo "- Job result: \\`${{ job.status }}\\`"
            echo '- Artifact: bounded worker logs retained for 14 days'
            echo '- Non-claim: this is GitHub Actions evidence, not runtime health, fleet health, or production deployment proof'
          } >> "$GITHUB_STEP_SUMMARY"
