name: Ω∞v Verification CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Continuous Verification & Provenance Attestation
    runs-on: ubuntu-latest
    env:
      OMEGA_SIGNING_KEY: ci-verification-signing-key

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Workspace Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 1. TypeScript Strict Verification
        run: pnpm run typecheck

      - name: 2. Monorepo Workspace Build
        run: pnpm run build

      - name: 3. Ω∞v Pluralism Omni-Cycle Verification
        run: pnpm run verify

      - name: 4. Full-Stack E2E Integration Suite
        run: pnpm run test:e2e

      - name: 5. CLI Terminal Binary Smoke Test
        run: |
          node bin/oceanicos.mjs status
          node bin/oceanicos.mjs cycle --json
          node bin/oceanicos.mjs mesh
          node bin/oceanicos.mjs keys

      - name: 6. Export Verification Evidence Artifact
        run: |
          mkdir -p artifacts
          node -e "
            const fs = require('fs');
            const artifact = {
              pipeline: 'Ω∞v Continuous Verification & Deep Pluralism Stack',
              timestamp: new Date().toISOString(),
              status: 'VERIFIED',
              architecture: 'Max Compress Zero-Entropy',
              packages: [
                '@oceanicos/types',
                '@oceanicos/observer',
                '@oceanicos/verification',
                '@oceanicos/remember',
                '@oceanicos/mini'
              ],
              provenance: {
                commit: process.env.GITHUB_SHA || 'local',
                branch: process.env.GITHUB_REF_NAME || 'main',
                runner: 'GitHub Actions'
              }
            };
            fs.writeFileSync('artifacts/verification-evidence.json', JSON.stringify(artifact, null, 2));
            console.log(JSON.stringify(artifact, null, 2));
          "

      - name: 7. Upload Evidence Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: artifacts/
