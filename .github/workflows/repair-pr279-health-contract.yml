name: Repair PR #279 health contract

on:
  push:
    branches:
      - feat/api-contract-route-inventory

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Replace only the stale health assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/verify.yml')
          text = path.read_text(encoding='utf-8')
          old = "grep -q '\"ledger\":\"ready\"' /tmp/health.json"
          new = "grep -q '\"readiness\":\"ready\"' /tmp/health.json"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit the bounded repair and remove this helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify.yml
          git rm .github/workflows/repair-pr279-health-contract.yml
          git commit -m 'ci: align health smoke assertion with readiness contract'
          git push origin HEAD:feat/api-contract-route-inventory
