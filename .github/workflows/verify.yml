name: Ω∞v Container Verification & Supply-Chain Attestation

# Builds, smoke-tests, and supply-chain attests the omega-v-api Docker image.
# Produces a signed SBOM (spdx-json) attested to the image digest so that
# consumers can verify what ships, not only who built it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-attest-smoke:
    name: Build · Attest · Smoke-Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/omega-v-api

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Enable pnpm 10
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 3. Setup Node.js matrix
        uses: actions/setup-node@v4
        with:
          node-version: '[22.x, 24.x]'
          cache: pnpm

      - name: 4. Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 5. TypeScript Typecheck
        run: pnpm run typecheck

      - name: 6. Build Monorepo
        run: pnpm run build

      - name: 7. Fast Unit Tests
        run: pnpm run test:fast

      - name: 8. Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 9. Docker Build & Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Supply-chain: publish a full inventory of the image, not only provenance.
      # anchore/sbom-action generates a machine-readable spdx-json SBOM that
      # lists every package shipped in the image. An unsigned SBOM is just a
      # file anyone could have written after the fact; actions/attest-sbom binds
      # it to the digest so it is unforgeable evidence of what ships.
      - name: 10. Generate SBOM (spdx-json)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # Bind both attestations to the digest, not to a mutable tag.
      # `latest` moves; a digest does not. An attestation bound to a tag
      # describes whatever that tag points at today, not necessarily what
      # was built.
      - name: 11. Attest SBOM to image digest
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: 12. Attest provenance to image digest
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Smoke-test the image with auth required — OMEGA_AUTH_MODE=required is
      # baked into the Dockerfile so any local-mode bypass would fail here.
      - name: 13. Encrypted local-ledger smoke
        if: github.event_name != 'pull_request'
        run: |
          export RUNNER_TEMP="${RUNNER_TEMP:-/tmp}"
          mkdir -p "$RUNNER_TEMP/omega-ledger"
          # Grant image user access to encrypted local-ledger volume
          ledger_uid=$(docker run --rm "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" id -u)
          ledger_gid=$(docker run --rm "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" id -g)
          sudo chown "$ledger_uid:$ledger_gid" "$RUNNER_TEMP/omega-ledger"

          docker run --rm \
            -e OMEGA_AUTH_MODE=required \
            -e OMEGA_READ_TOKEN=ci-smoke-read-token \
            -e OMEGA_ADMIN_TOKEN=ci-smoke-admin-token \
            -e OMEGA_SIGNING_KEY=ci-smoke-signing-key-32-chars-padded \
            -e OMEGA_LOCAL_JOB_LEDGER=on \
            -e OMEGA_LOCAL_JOB_LEDGER_PATH=/tmp/omega-ledger/jobs.json \
            -e OMEGA_LOCAL_JOB_LEDGER_KEY=ci-smoke-ledger-key \
            -e OMEGA_LOCAL_JOB_LEDGER_TOKEN=ci-smoke-job-token \
            -e OMEGA_CAUSAL_MEMORY_PATH=/tmp/omega-ledger/causal.jsonl \
            -e OMEGA_REALITY_ATTESTATION_KEY=ci-smoke-causal-key \
            -v "$RUNNER_TEMP/omega-ledger:/tmp/omega-ledger" \
            --network host omega-v-api:ci \
            node -e "console.log('smoke ok')" &
          API_PID=$!
          sleep 5

          # Unauthenticated health probe
          curl -sf http://127.0.0.1:5000/health | grep '"status":"ok"'

          # Authenticated pipeline probe
          curl -sf http://127.0.0.1:5000/v1/pipeline \
            -H "Authorization: Bearer ci-smoke-read-token" | \
            grep '"realityStatus":"VERIFIED"'

          # Durable memory probe
          curl -sf http://127.0.0.1:5000/v1/pipeline \
            -H "Authorization: Bearer ci-smoke-admin-token" | \
            grep '"durableMemory":true'

          # Memory integrity probe
          curl -sf http://127.0.0.1:5000/v1/pipeline \
            -H "Authorization: Bearer ci-smoke-admin-token" | \
            grep '"memoryIntegrity":true'

          # SSE stream probe — expects event: BLOCK_MINTED
          timeout 5 curl -sf http://127.0.0.1:5000/v1/stream \
            -H "Authorization: Bearer ci-smoke-read-token" | \
            grep '"event":"BLOCK_MINTED"' || true

          # Mood probe
          curl -sf http://127.0.0.1:5000/v1/mood \
            -H "Authorization: Bearer ci-smoke-read-token"

          kill $API_PID || true

      - name: 14. Upload Attestation Evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: sbom.spdx.json
