name: Verification Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Enable pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.8.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Generate coverage report
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build packages
        run: pnpm build

      - name: Create verification attestation
        if: success()
        run: |
          echo "✓ Verification successful at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed: lint, type-check, test, build" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Verification pipeline passed\n\n' +
                    '- ✓ Linting\n' +
                    '- ✓ Type checking\n' +
                    '- ✓ Tests\n' +
                    '- ✓ Build\n\n' +
                    'Ready for review!'
            })

  docker:
    name: Package and smoke test
    runs-on: ubuntu-latest
    needs: verify

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v3

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t omega-v-api:ci .

      - name: Refuse to start without a signing key
        run: |
          if docker run --rm omega-v-api:ci; then
            echo "::error::Container started with no OMEGA_SIGNING_KEY. Attestations would be forgeable."
            exit 1
          fi
          echo "Container exited non-zero without a signing key, as required."

      - name: Start the container
        run: |
          docker run -d --name omega-smoke \
            -e OMEGA_SIGNING_KEY=ci-smoke-key-not-for-production \
            -p 3000:3000 omega-v-api:ci

      - name: Smoke test the running service
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then break; fi
            sleep 1
          done

          curl -sf http://localhost:3000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          curl -sf http://localhost:3000/rules | tee /tmp/rules.json
          grep -q '"registered":2' /tmp/rules.json

          curl -sf -X POST http://localhost:3000/complete-loop \
            -H 'Content-Type: application/json' \
            -d '{"claim":"container is healthy","category":"health-check","source":{"system":"ci-smoke","version":"0.1.0","environment":"ci"},"observedBy":"github-actions","metadata":{"statusCode":200,"responseTime":12},"confidence":0.95,"confidenceReason":"smoke test"}' \
            | tee /tmp/loop.json
          grep -q '"verified":true' /tmp/loop.json

          curl -sf http://localhost:3000/log | tee /tmp/log.json
          grep -q '"appendOnly":true' /tmp/log.json

          # The client addresses the API under /api. In production there is
          # no dev-server proxy, so the same routes must answer under the
          # prefix the built bundle actually calls.
          curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'
          curl -sf http://localhost:3000/api/rules  | grep -q '"registered":2'

          # And the client itself must be served from that same origin.
          curl -sf http://localhost:3000/ | tee /tmp/index.html
          grep -qi '<div id="root"' /tmp/index.html

      - name: Container logs
        if: always()
        run: docker logs omega-smoke || true

      - name: Stop the container
        if: always()
        run: docker rm -f omega-smoke || true

      - name: Record the artifact
        if: success()
        run: |
          echo "### 📦 Artifact" >> $GITHUB_STEP_SUMMARY
          echo "\`omega-v-api:ci\` built, refused to start without a signing key," >> $GITHUB_STEP_SUMMARY
          echo "then served /health, /rules, /complete-loop and /log." >> $GITHUB_STEP_SUMMARY
          docker image inspect omega-v-api:ci --format 'Image size: {{.Size}} bytes' >> $GITHUB_STEP_SUMMARY

  publish:
    name: Publish attested artifact
    runs-on: ubuntu-latest
    needs: [verify, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      # ATTEST ≠ ASSERT. The pipeline says the artifact passed; this is the
      # part that can be checked by someone who was not here. Produces a
      # signed, verifiable record of which commit and which workflow built
      # this exact digest.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record the published artifact
        run: |
          echo "### 🚀 Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.image.outputs.name }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Digest: \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verify the provenance without trusting this summary:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "gh attestation verify oci://${{ steps.image.outputs.name }}:${{ github.sha }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --repo ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
