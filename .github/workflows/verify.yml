name: Verification Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Enable pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.8.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Generate coverage report
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build packages
        run: pnpm build

      - name: Create verification attestation
        if: success()
        run: |
          echo "✓ Verification successful at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed: lint, type-check, test, build" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Verification pipeline passed\n\n' +
                    '- ✓ Linting\n' +
                    '- ✓ Type checking\n' +
                    '- ✓ Tests\n' +
                    '- ✓ Build\n\n' +
                    'Ready for review!'
            })

  container-smoke:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: docker compose -f infra/docker/docker-compose.yml build

      - name: Start and smoke test production stack
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d --wait
          curl --fail http://localhost:3000/health
          curl --fail http://localhost:3001/
          curl --fail -X POST http://localhost:3000/complete-loop \
            -H 'Content-Type: application/json' \
            -d '{"claim":"CI container is healthy","category":"health-check","source":{"system":"ci","version":"0.1.0","environment":"container"},"observedBy":"ci","metadata":{"responseTime":42,"statusCode":200},"confidence":0.95,"confidenceReason":"CI smoke evidence"}' \
            | tee /tmp/omega-loop.json
          node -e "const fs=require('fs'); const payload=JSON.parse(fs.readFileSync('/tmp/omega-loop.json','utf8')); if (!payload.data || !payload.data.verification.summary.passed || !payload.data.attestation.verified) process.exit(1);"

      - name: Tear down production stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down -v
