name: Verification Pipeline

on:
  push:
    branches: [main, develop]
  # Every pull request, whatever it targets.
  #
  # This was filtered to [main, develop], which meant a pull request based on
  # another branch ran no jobs at all. Nothing failed, because nothing ran, and
  # GitHub shows an absence of checks much the way it shows passing ones — so a
  # stacked pull request looked ready to merge without a single test having
  # executed against it.
  #
  # Unverified is not the same as green. Leaving the filter off costs a little
  # runner time and removes a class of change that could reach a base branch
  # without proof.
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    strategy:
      matrix:
        # 22.x is what the published container runs. 24.x is the next LTS,
        # so a break arrives as a red pull request rather than as a
        # surprise on the day it becomes the default.
        #
        # 20.x was removed: the project now requires Node 22+ (engines field
        # in package.json), the image has moved to node:22-alpine, and
        # testing a runtime below the declared floor proves compatibility the
        # project does not promise.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # Runs on every matrix version. ESLint 10 calls util.styleText, added in
      # Node 20.12, and the matrix floor is 22.x — so there is no version here
      # it cannot execute on.
      #
      # This step used to carry `if: matrix.node-version != '18.x'`, with a
      # comment arguing that Node 18 stayed in the matrix on purpose. #162
      # then removed 18 (end of life April 2025, the published container is
      # node:22-alpine, and Vite 8 could not build there), which left the
      # guard always true and the comment asserting a matrix entry that no
      # longer existed. A reader would have believed 18 was still covered.
      - name: Run linting
        run: pnpm lint

      - name: Run type checking
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      # The root test suite proves repository coverage, while this command
      # proves every package/application entrypoint remains independently
      # runnable from its own declared worker boundary.
      - name: Run package-worker verification
        run: pnpm test:packages

      - name: Generate coverage report
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build packages
        run: pnpm build

      # The published bin is the file users actually execute, and nothing
      # imports it, so a broken entrypoint would ship silently. This runs
      # the built artifact rather than the source.
      - name: Run the canonical CLI entrypoint
        run: |
          node bin/oceanicos.mjs --help > /tmp/cli-help.txt
          grep -q 'OCEANICOS DEEP-TIER CRYPTOGRAPHIC CLI' /tmp/cli-help.txt
          grep -q 'status' /tmp/cli-help.txt

          set +e
          node bin/oceanicos.mjs definitely-not-a-command > /dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::Unknown command exited $status, expected 2"
            exit 1
          fi
          echo "Built CLI starts, prints usage, and rejects unknown commands."

      - name: Create verification attestation
        if: success()
        run: |
          echo "✓ Verification successful at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "All checks passed: format, lint, type-check, test, build" >> $GITHUB_STEP_SUMMARY

  windows:
    name: Windows compatibility
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run type checking
        run: pnpm --recursive run build

      - name: Run workspace type checking
        run: pnpm --recursive run typecheck

      - name: Run tests
        run: pnpm exec node --experimental-strip-types --test ./tests/integration/max_compress_stack.e2e.test.ts

      - name: Build packages
        run: pnpm --recursive run build

  docker:
    name: Package and smoke test
    runs-on: ubuntu-latest
    needs: verify

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t omega-v-api:ci .

      - name: Refuse to start without a signing key
        run: |
          if docker run --rm omega-v-api:ci; then
            echo "::error::Container started with no OMEGA_SIGNING_KEY. Attestations would be forgeable."
            exit 1
          fi
          echo "Container exited non-zero without a signing key, as required."

      - name: Prepare encrypted local-ledger volume
        run: |
          mkdir -p "$RUNNER_TEMP/omega-ledger"
          chmod 700 "$RUNNER_TEMP/omega-ledger"

      # The image runs as the non-root `omega` user. A runner-created 0700
      # directory is otherwise owned by the host runner, so the first job
      # write fails inside the container with a generic JOB_INVALID response.
      - name: Grant image user access to encrypted local-ledger volume
        run: |
          ledger_uid=$(docker run --rm --entrypoint sh omega-v-api:ci -c 'id -u')
          ledger_gid=$(docker run --rm --entrypoint sh omega-v-api:ci -c 'id -g')
          sudo chown "$ledger_uid:$ledger_gid" "$RUNNER_TEMP/omega-ledger"
          stat -c '%U:%G %a %n' "$RUNNER_TEMP/omega-ledger"

      - name: Start the container
        run: |
          docker run -d --name omega-smoke \
            -e OMEGA_SIGNING_KEY=ci-smoke-key-not-for-production-2026-strong \
            -e OMEGA_AUTH_MODE=required \
            -e OMEGA_ALLOW_UNSIGNED_CYCLE=true \
            -e OMEGA_READ_TOKEN=ci-smoke-read-token \
            -e OMEGA_ADMIN_TOKEN=ci-smoke-admin-token \
            -e OMEGA_LOCAL_JOB_LEDGER=on \
            -e OMEGA_LOCAL_JOB_LEDGER_TOKEN=ci-smoke-job-token \
            -e OMEGA_LOCAL_JOB_LEDGER_PATH=/tmp/omega-ledger/jobs.json \
            -e OMEGA_LOCAL_JOB_LEDGER_KEY=ci-smoke-ledger-key \
            -v "$RUNNER_TEMP/omega-ledger:/tmp/omega-ledger" \
            --network host omega-v-api:ci

      - name: Smoke test the API service
        run: |
          api=http://localhost:5000
          for attempt in $(seq 1 30); do
            if curl -sf "$api/health" > /dev/null; then break; fi
            sleep 1
          done

          curl -sf "$api/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"service":"omega-v-oceanicos-api"' /tmp/health.json
          grep -q '"readiness":"ready"' /tmp/health.json

          if [ "$(curl -sS -o /tmp/tip-unauthenticated.json -w '%{http_code}' "$api/v1/block/tip")" != "401" ]; then
            echo "::error::Unauthenticated tip read was not rejected in required mode."
            cat /tmp/tip-unauthenticated.json
            exit 1
          fi

          curl -sf -H 'Authorization: Bearer ci-smoke-read-token' \
            "$api/v1/block/tip" | tee /tmp/tip.json
          grep -q '"status":"ONLINE"' /tmp/tip.json

          if [ "$(curl -sS -o /tmp/cycle-read-token.json -w '%{http_code}' -X POST "$api/v1/cycle" \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-smoke-read-token' \
            -d '{}')" != "401" ]; then
            echo "::error::Read token was accepted for a state-changing cycle."
            cat /tmp/cycle-read-token.json
            exit 1
          fi

          curl -sf -X POST "$api/v1/cycle" \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-smoke-admin-token' \
            -d '{}' | tee /tmp/cycle.json
          grep -q '"success":true' /tmp/cycle.json
          grep -q '"block"' /tmp/cycle.json

          timeout 8s curl -sN \
            -H 'Authorization: Bearer ci-smoke-read-token' \
            "$api/v1/stream" > /tmp/stream.ndjson &
          stream_pid=$!
          sleep 1
          curl -sf -X POST "$api/v1/cycle" \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer ci-smoke-admin-token' \
            -d '{}' > /tmp/stream-cycle.json
          wait "$stream_pid" || true
          grep -q '"event":"TIP"' /tmp/stream.ndjson
          grep -q '"event":"BLOCK_MINTED"' /tmp/stream.ndjson

          curl -sf -H 'Authorization: Bearer ci-smoke-read-token' \
            "$api/v1/miner/status" | tee /tmp/miner.json
          grep -q '"success":true' /tmp/miner.json

          curl -sf -H 'Authorization: Bearer ci-smoke-read-token' \
            "$api/v1/mood" | tee /tmp/mood.json
          grep -q '"status"' /tmp/mood.json

          if [ "$(curl -sS -o /tmp/unknown.json -w '%{http_code}' \
            -H 'Authorization: Bearer ci-smoke-read-token' "$api/unknown")" != "404" ]; then
            echo "::error::Unknown API route did not return 404."
            cat /tmp/unknown.json
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs omega-smoke || true

      - name: Stop the container
        if: always()
        run: docker rm -f omega-smoke || true

      - name: Record the artifact
        if: success()
        run: |
          echo "### 📦 Artifact" >> $GITHUB_STEP_SUMMARY
          echo "\`omega-v-api:ci\` built, refused to start without a signing key," >> $GITHUB_STEP_SUMMARY
          echo "then served /health and the authenticated /v1 API contract on port 5000." >> $GITHUB_STEP_SUMMARY
          docker image inspect omega-v-api:ci --format 'Image size: {{.Size}} bytes' >> $GITHUB_STEP_SUMMARY

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose interpolation and service graph
        env:
          OMEGA_SIGNING_KEY: ci-compose-signing-key-not-for-production-2026-strong
          OMEGA_READ_TOKEN: ci-compose-read-token
          OMEGA_ADMIN_TOKEN: ci-compose-admin-token
        run: docker compose config --quiet

  report:
    name: Report pipeline result
    runs-on: ubuntu-latest
    needs: [verify, windows, docker, compose]
    # always(), so a failed pipeline is reported rather than passed over in
    # silence. A comment that only ever appears on success is not a report.
    if: always() && github.event_name == 'pull_request'

    permissions:
      pull-requests: write

    steps:
      # This comment used to live inside the verify job, which runs as a
      # node-version matrix. It therefore posted once per matrix leg — two
      # identical "Verification pipeline passed" comments on PR #27 — and the
      # first appeared while the other leg was still running and before the
      # docker job had started at all.
      #
      # So it announced "Ready for review!" on the strength of one matrix leg,
      # for a pipeline that had not finished. GREEN = EXECUTABLE_PROOF_ONLY is
      # this repository's rule, and its own bot was breaking it.
      #
      # Here the job depends on everything it speaks for, runs once, and
      # reports the results it was actually given.
      - name: Comment PR with the real result
        uses: actions/github-script@v9
        with:
          script: |
            const verify = '${{ needs.verify.result }}';
            const windows = '${{ needs.windows.result }}';
            const docker = '${{ needs.docker.result }}';
            const compose = '${{ needs.compose.result }}';
            const ok = verify === 'success' && windows === 'success' && docker === 'success' && compose === 'success';
            const mark = (r) => (r === 'success' ? '✓' : r === 'skipped' ? '–' : '✗');

            const body = [
              ok
                ? '✅ Verification pipeline passed'
                : '❌ Verification pipeline did not pass',
              '',
              `- ${mark(verify)} verify (format, lint, type-check, test, coverage, build) — ${verify}`,
              `- ${mark(windows)} Windows compatibility (format, type-check, test, build) — ${windows}`,
              `- ${mark(docker)} package and smoke test — ${docker}`,
              `- ${mark(compose)} Compose configuration — ${compose}`,
              '',
              ok
                ? 'Every job this comment names completed successfully.'
                : 'Details are in the checks tab. This comment reports what ran, not what was hoped for.',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  publish:
    name: Publish attested artifact
    runs-on: ubuntu-latest
    needs: [verify, windows, docker, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      # ATTEST ≠ ASSERT. The pipeline says the artifact passed; this is the
      # part that can be checked by someone who was not here. Produces a
      # signed, verifiable record of which commit and which workflow built
      # this exact digest.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Provenance says who built the image. It says nothing about what is
      # inside it. A consumer asking "does this ship a package with a known
      # CVE" had no way to answer without pulling and unpacking the image.
      - name: Generate an SBOM for the published image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # Signed, so the inventory is evidence rather than a file anyone
      # could have written afterwards.
      - name: Attest the SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Record the published artifact
        run: |
          echo "### 🚀 Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Signed provenance and a signed SPDX inventory are attached to the digest." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.image.outputs.name }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Digest: \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verify the provenance without trusting this summary:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "gh attestation verify oci://${{ steps.image.outputs.name }}:${{ github.sha }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --repo ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
